name: cd

# Publishing a release promotes its commit: the image and the syncroot artifact already exist under the
# commit SHA (ci.yml); here they get the release tag and `prod`. Flux in the homelab follows `prod`.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SYNCROOT: oci://ghcr.io/${{ github.repository }}/bunnylane-status-syncroot
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the release commit
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.release.target_commitish }}"
          if [[ "${#SHA}" -ne 40 ]]; then
            SHA=$(gh api "repos/${{ github.repository }}/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: imjasonh/setup-crane@v0.4
      - uses: fluxcd/flux2/action@main

      - name: Tag the image
        run: |
          crane tag "$IMAGE:${{ steps.sha.outputs.sha }}" "$RELEASE_TAG"
          crane tag "$IMAGE:${{ steps.sha.outputs.sha }}" prod

      - name: Tag the manifests
        run: |
          flux tag artifact "$SYNCROOT:${{ steps.sha.outputs.sha }}" --tag "$RELEASE_TAG"
          flux tag artifact "$SYNCROOT:${{ steps.sha.outputs.sha }}" --tag prod
