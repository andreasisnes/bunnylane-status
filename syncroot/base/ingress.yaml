apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: status
  namespace: status
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: status-status-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - status.bunnylane.no
      secretName: status-bunnylane-tls
  rules:
    - host: status.bunnylane.no
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: status
                port:
                  number: 80
