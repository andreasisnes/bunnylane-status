apiVersion: apps/v1
kind: Deployment
metadata:
  name: status
  namespace: status
  labels:
    app.kubernetes.io/name: status
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: status
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status
    spec:
      serviceAccountName: status
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: status
          image: ghcr.io/andreasisnes/bunnylane-status
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: STATUS__PrometheusUrl
              value: http://kps-prometheus.monitoring.svc:9090
            - name: STATUS__JellyfinUrl
              value: http://jellyfin.jellyfin.svc:8096
            - name: STATUS__JellyfinApiKey
              valueFrom:
                secretKeyRef:
                  name: status-jellyfin
                  key: api-key
                  optional: true
            - name: STATUS__SqlitePath
              value: /data/status.db
            - name: STATUS__TraefikNamespace
              value: traefik
            - name: DOTNET_EnableDiagnostics
              value: "0"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          # /healthz, not /readyz: the app degrades to [UNKNOWN] when Prometheus is away and must stay reachable
          # to say so. /readyz is an operator signal only (and nothing warms it without traffic).
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: status-data
        - name: tmp
          emptyDir: {}
