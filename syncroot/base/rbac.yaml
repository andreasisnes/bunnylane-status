apiVersion: v1
kind: ServiceAccount
metadata:
  name: status
  namespace: status
automountServiceAccountToken: true
---
# Read Traefik's access log stream, nothing else, nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: status-traefik-logs
  namespace: traefik
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: status-traefik-logs
  namespace: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: status-traefik-logs
subjects:
  - kind: ServiceAccount
    name: status
    namespace: status
